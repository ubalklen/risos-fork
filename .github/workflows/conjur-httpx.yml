name: Test ConJur with HTTPX session

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/conjur-httpx.yml"
      - "scripts/check_conjur_httpx.py"
      - "src/risos/httpx_session.py"
      - "tests/test_httpx_session.py"
      - "sites/conjur-lenio-streck.yaml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  check-httpx:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - run: uv sync --locked --extra browser

      - name: Install native Chrome
        run: uv run --no-sync patchright install chrome

      - name: Generate ConJur feed through HTTPX after session validation
        run: uv run --no-sync python scripts/check_conjur_httpx.py sites/conjur-lenio-streck.yaml --browser-session --output-dir httpx-output

      - name: Verify generated feed
        shell: pwsh
        run: |
          $rss = [xml](Get-Content httpx-output/conjur-lenio-streck.rss.xml -Raw)
          if (@($rss.rss.channel.item).Count -eq 0) {
            throw "ConJur RSS has no articles"
          }

      - name: Upload generated feeds
        uses: actions/upload-artifact@v4
        with:
          name: conjur-httpx-feeds
          path: httpx-output/*.xml
          if-no-files-found: error