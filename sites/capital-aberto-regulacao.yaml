      attribute: "text"
    link:
      xpath: "(.//h2/ancestor::a[1] | .//*[@data-slot='card-title']//a)[1]"
      attribute: "href"
      transforms:
        - type: absolute_url
          base_url: "https://capitalaberto.com.br"
    guid:
      xpath: "(.//h2/ancestor::a[1] | .//*[@data-slot='card-title']//a)[1]"
      attribute: "href"
      transforms:
        - type: absolute_url
          base_url: "https://capitalaberto.com.br"