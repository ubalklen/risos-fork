feed:
  title: "Capital Aberto - Regulação"
  link: "https://capitalaberto.com.br/regulacao"
  description: "Artigos de Regulação sobre ITCMD, herança, sucessão e temas relacionados"
  language: "pt-br"

source:
  url: "https://capitalaberto.com.br/regulacao"
  headers:
    User-Agent: "risos/1.0"

